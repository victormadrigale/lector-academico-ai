name: lector_academico_ai
version: 0.3.0+3
publish_to: 'none'
description: Lector academico movil gratuito, local-first y preparado para IA local.

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^12.1.2
  path_provider: ^2.1.6
  path: ^1.9.1
  sqflite: ^2.4.3
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  connectivity_plus: ^7.3.1
  pdfrx: ^2.5.0
  pdf: ^3.11.3
  archive: ^4.2.0
  xml: ^7.0.1
  share_plus: ^13.3.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
